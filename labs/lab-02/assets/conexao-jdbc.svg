<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t d">
  <title id="t">Conexão do Glue até um banco em uma subnet privada</title>
  <desc id="d">O crawler do Glue usa uma conexão com URL JDBC, secret no Secrets Manager e uma subnet com security group. Uma interface de rede na subnet privada chega ao banco RDS, e o catálogo recebe as tabelas.</desc>
  <style>
    .h{font:bold 14px sans-serif;fill:#16191F}
    .t{font:13px sans-serif;fill:#16191F}
    .n{font:12px sans-serif;fill:#5F6B7A}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/>
    </marker>
  </defs>
  <rect x="10" y="30" width="170" height="100" rx="8" fill="#FFF8EC" stroke="#F39C12" stroke-width="2"/>
  <text x="95" y="58" text-anchor="middle" class="h">Crawler JDBC</text>
  <text x="95" y="80" text-anchor="middle" class="n">usa a conexão</text>
  <text x="95" y="100" text-anchor="middle" class="n">workshop-lab-02-banco</text>
  <rect x="10" y="150" width="170" height="110" rx="8" fill="#F2F3F3" stroke="#5F6B7A"/>
  <text x="95" y="176" text-anchor="middle" class="h">Conexão do Glue</text>
  <text x="95" y="198" text-anchor="middle" class="n">URL JDBC</text>
  <text x="95" y="216" text-anchor="middle" class="n">secret (senha)</text>
  <text x="95" y="234" text-anchor="middle" class="n">subnet e security group</text>
  <line x1="95" y1="150" x2="95" y2="132" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="230" y="20" width="330" height="250" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="395" y="44" text-anchor="middle" class="h">Sua VPC</text>
  <rect x="250" y="60" width="290" height="190" rx="8" fill="#FFFFFF" stroke="#1A73E8" stroke-dasharray="6 4"/>
  <text x="395" y="82" text-anchor="middle" class="t">Subnet privada</text>
  <rect x="268" y="96" width="120" height="64" rx="6" fill="#FFF8EC" stroke="#F39C12"/>
  <text x="328" y="122" text-anchor="middle" class="t">Interface de</text>
  <text x="328" y="140" text-anchor="middle" class="t">rede do Glue</text>
  <rect x="408" y="96" width="120" height="64" rx="6" fill="#EAF9F0" stroke="#2ECC71" stroke-width="2"/>
  <text x="468" y="122" text-anchor="middle" class="h">Amazon RDS</text>
  <text x="468" y="140" text-anchor="middle" class="n">porta 5432</text>
  <line x1="388" y1="128" x2="406" y2="128" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
  <text x="395" y="190" text-anchor="middle" class="n">Security group: o Glue precisa chegar à porta do banco</text>
  <text x="395" y="208" text-anchor="middle" class="n">e permitir tráfego entre si (regra com o próprio SG)</text>
  <text x="395" y="232" text-anchor="middle" class="n">Saídas: endpoint do S3 e do Secrets Manager, ou NAT</text>
  <line x1="180" y1="100" x2="266" y2="120" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="600" y="100" width="110" height="80" rx="8" fill="#EAF2FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="655" y="132" text-anchor="middle" class="h">Data Catalog</text>
  <text x="655" y="154" text-anchor="middle" class="n">tabelas do banco</text>
  <line x1="560" y1="140" x2="598" y2="140" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
</svg>
