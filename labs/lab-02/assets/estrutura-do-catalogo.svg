<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" role="img" aria-labelledby="t d">
  <title id="t">Estrutura do Data Catalog e quem consome o catálogo</title>
  <desc id="d">O Data Catalog tem databases com tabelas, e cada tabela tem colunas, formato, localização no S3 e partições. A tabela aponta para os dados no S3. Athena, Glue ETL, EMR e Redshift Spectrum leem o mesmo catálogo.</desc>
  <style>
    .h{font:bold 14px sans-serif;fill:#16191F}
    .t{font:13px sans-serif;fill:#16191F}
    .n{font:12px sans-serif;fill:#5F6B7A}
    .m{font:12px monospace;fill:#16191F}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/>
    </marker>
  </defs>
  <rect x="10" y="10" width="360" height="300" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="190" y="36" text-anchor="middle" class="h">AWS Glue Data Catalog</text>
  <rect x="30" y="52" width="320" height="248" rx="8" fill="#FFFFFF" stroke="#1A73E8"/>
  <text x="45" y="76" class="h">Database: anycompany</text>
  <rect x="45" y="90" width="290" height="100" rx="6" fill="#EAF9F0" stroke="#2ECC71"/>
  <text x="58" y="112" class="h">Tabela: pedidos</text>
  <text x="58" y="132" class="m">colunas: id_pedido, valor, status</text>
  <text x="58" y="150" class="m">formato: CSV (SerDe)</text>
  <text x="58" y="168" class="m">local: s3://.../pedidos/</text>
  <rect x="45" y="200" width="290" height="38" rx="6" fill="#FFF8EC" stroke="#F39C12"/>
  <text x="58" y="224" class="m">partições: dt=2026-03-08 ... 03-10</text>
  <rect x="45" y="248" width="290" height="38" rx="6" fill="#F2F3F3" stroke="#5F6B7A"/>
  <text x="58" y="272" class="t">Conexão (banco JDBC) e outras tabelas</text>

  <rect x="430" y="20" width="270" height="60" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
  <text x="565" y="46" text-anchor="middle" class="h">Amazon S3</text>
  <text x="565" y="66" text-anchor="middle" class="n">os dados ficam aqui</text>
  <line x1="335" y1="140" x2="430" y2="60" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)" stroke-dasharray="5 4"/>
  <text x="400" y="112" class="n">aponta</text>

  <text x="565" y="122" text-anchor="middle" class="h">Consumidores do catálogo</text>
  <rect x="430" y="134" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#7B3FB5"/><text x="495" y="156" text-anchor="middle" class="t">Athena</text>
  <rect x="570" y="134" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#7B3FB5"/><text x="635" y="156" text-anchor="middle" class="t">Glue ETL</text>
  <rect x="430" y="178" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#7B3FB5"/><text x="495" y="200" text-anchor="middle" class="t">EMR</text>
  <rect x="570" y="178" width="130" height="34" rx="6" fill="#FFFFFF" stroke="#7B3FB5"/><text x="635" y="200" text-anchor="middle" class="t">Redshift Spectrum</text>
  <line x1="430" y1="190" x2="372" y2="190" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
  <text x="565" y="250" text-anchor="middle" class="n">o esquema é definido uma vez,</text>
  <text x="565" y="268" text-anchor="middle" class="n">todos os motores o reaproveitam</text>
</svg>
