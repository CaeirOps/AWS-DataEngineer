<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 280" width="720" height="280" role="img" aria-labelledby="t d">
  <title id="t">Formas de manter as partições do catálogo sincronizadas</title>
  <desc id="d">Uma pasta nova dt=2026-03-11 chega ao S3. Ela pode ser registrada por crawler incremental, MSCK REPAIR TABLE, ALTER TABLE ADD PARTITION ou BatchCreatePartition. Com partition projection, o Athena calcula as partições e não precisa do registro.</desc>
  <style>
    .h{font:bold 14px sans-serif;fill:#16191F}
    .t{font:13px sans-serif;fill:#16191F}
    .n{font:12px sans-serif;fill:#5F6B7A}
    .m{font:12px monospace;fill:#16191F}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="190" height="90" rx="8" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
  <text x="105" y="46" text-anchor="middle" class="h">Amazon S3</text>
  <text x="105" y="68" text-anchor="middle" class="m">dt=2026-03-10/</text>
  <rect x="25" y="76" width="160" height="26" rx="4" fill="#EAF9F0" stroke="#2ECC71" stroke-width="2"/>
  <text x="105" y="94" text-anchor="middle" class="m">dt=2026-03-11/ (nova)</text>

  <rect x="500" y="20" width="210" height="90" rx="8" fill="#EAF2FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="605" y="46" text-anchor="middle" class="h">Data Catalog</text>
  <text x="605" y="68" text-anchor="middle" class="m">dt=2026-03-10</text>
  <text x="605" y="92" text-anchor="middle" class="n">dt=2026-03-11: falta registrar</text>

  <rect x="230" y="20" width="240" height="30" rx="6" fill="#FFF8EC" stroke="#F39C12"/>
  <text x="350" y="40" text-anchor="middle" class="t">Crawler incremental (DPU-hora)</text>
  <rect x="230" y="58" width="240" height="30" rx="6" fill="#FFF8EC" stroke="#F39C12"/>
  <text x="350" y="78" text-anchor="middle" class="t">MSCK REPAIR TABLE (Athena)</text>
  <rect x="230" y="96" width="240" height="30" rx="6" fill="#FFF8EC" stroke="#F39C12"/>
  <text x="350" y="116" text-anchor="middle" class="t">ALTER TABLE ADD PARTITION</text>
  <rect x="230" y="134" width="240" height="30" rx="6" fill="#FFF8EC" stroke="#F39C12"/>
  <text x="350" y="154" text-anchor="middle" class="t">API BatchCreatePartition</text>
  <line x1="200" y1="65" x2="228" y2="65" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="470" y1="80" x2="498" y2="80" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="10" y="190" width="700" height="80" rx="10" fill="#EAF9F0" stroke="#2ECC71" stroke-width="2"/>
  <text x="360" y="216" text-anchor="middle" class="h">Partition projection (só Athena)</text>
  <text x="360" y="238" text-anchor="middle" class="t">O Athena calcula as partições pelas propriedades da tabela</text>
  <text x="360" y="256" text-anchor="middle" class="n">sem registrar nada no catálogo: a pasta nova já é consultável</text>
</svg>
