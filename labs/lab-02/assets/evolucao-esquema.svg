<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">Uma coluna nova no arquivo e o que cada configuração do crawler faz</title>
  <desc id="d">O arquivo de estoque ganhou a coluna categoria. Com UpdateBehavior LOG, a tabela continua sem a coluna e o crawler só registra. Com UPDATE_IN_DATABASE, a tabela passa a ter a coluna e os arquivos antigos devolvem nulo para ela.</desc>
  <style>
    .h{font:bold 14px sans-serif;fill:#16191F}
    .t{font:13px sans-serif;fill:#16191F}
    .n{font:12px sans-serif;fill:#5F6B7A}
    .m{font:12px monospace;fill:#16191F}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/>
    </marker>
  </defs>
  <text x="130" y="24" text-anchor="middle" class="h">Arquivo antigo (v1)</text>
  <rect x="10" y="34" width="240" height="56" rx="6" fill="#F2F3F3" stroke="#5F6B7A"/>
  <text x="20" y="54" class="m">sku,descricao,quantidade,preco</text>
  <text x="20" y="74" class="m">CAM-042,Camiseta azul,120,39.90</text>

  <text x="130" y="124" text-anchor="middle" class="h">Arquivo novo (v2)</text>
  <rect x="10" y="134" width="240" height="56" rx="6" fill="#EAF9F0" stroke="#2ECC71" stroke-width="2"/>
  <text x="20" y="154" class="m">sku,descricao,quantidade,preco,</text>
  <text x="20" y="170" class="m">categoria</text>
  <text x="20" y="184" class="m">CAM-050,Meia,60,9.90,moda</text>

  <line x1="250" y1="162" x2="298" y2="162" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
  <rect x="300" y="132" width="90" height="60" rx="8" fill="#FFF8EC" stroke="#F39C12" stroke-width="2"/>
  <text x="345" y="158" text-anchor="middle" class="h">Crawler</text>
  <text x="345" y="176" text-anchor="middle" class="n">nova varredura</text>

  <line x1="390" y1="150" x2="448" y2="80" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
  <line x1="390" y1="175" x2="448" y2="240" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>

  <rect x="450" y="20" width="260" height="120" rx="8" fill="#FDEDEB" stroke="#E74C3C"/>
  <text x="580" y="44" text-anchor="middle" class="h">UpdateBehavior = LOG</text>
  <text x="580" y="68" text-anchor="middle" class="t">A tabela continua com 4 colunas</text>
  <text x="580" y="88" text-anchor="middle" class="t">O crawler só registra a mudança</text>
  <text x="580" y="116" text-anchor="middle" class="n">a coluna nova fica invisível ao SQL</text>

  <rect x="450" y="160" width="260" height="130" rx="8" fill="#EAF9F0" stroke="#2ECC71"/>
  <text x="580" y="184" text-anchor="middle" class="h">UPDATE_IN_DATABASE</text>
  <text x="580" y="208" text-anchor="middle" class="t">A tabela passa a ter 5 colunas</text>
  <text x="580" y="228" text-anchor="middle" class="t">Arquivos antigos: categoria = nulo</text>
  <text x="580" y="256" text-anchor="middle" class="n">os dados não são reescritos;</text>
  <text x="580" y="272" text-anchor="middle" class="n">só a definição da tabela muda</text>
</svg>
