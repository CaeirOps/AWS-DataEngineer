<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 210" width="720" height="210" role="img" aria-labelledby="t d">
  <title id="t">Linha do tempo da regra de Lifecycle de pedidos</title>
  <desc id="d">Do dia 0 ao 30 o objeto fica no S3 Standard; aos 30 dias vai para Standard-IA; aos 90 para Glacier Instant Retrieval; aos 365 a versão atual expira. Versões antigas são apagadas 30 dias depois de deixarem de ser atuais.</desc>
  <style>
    .h{font:bold 13px sans-serif;fill:#16191F}
    .n{font:12px sans-serif;fill:#5F6B7A}
  </style>
  <rect x="20" y="40" width="80" height="40" fill="#1A73E8"/>
  <rect x="100" y="40" width="160" height="40" fill="#7B3FB5"/>
  <rect x="260" y="40" width="400" height="40" fill="#0E7C66"/>
  <text x="60" y="65" text-anchor="middle" style="font:bold 12px sans-serif;fill:#FFFFFF">Standard</text>
  <text x="180" y="65" text-anchor="middle" style="font:bold 12px sans-serif;fill:#FFFFFF">Standard-IA</text>
  <text x="460" y="65" text-anchor="middle" style="font:bold 12px sans-serif;fill:#FFFFFF">Glacier Instant Retrieval</text>
  <line x1="660" y1="30" x2="660" y2="90" stroke="#E74C3C" stroke-width="3"/>
  <text x="660" y="22" text-anchor="middle" class="h">expira</text>
  <text x="20" y="105" class="n">dia 0</text>
  <text x="100" y="105" text-anchor="middle" class="n">30</text>
  <text x="260" y="105" text-anchor="middle" class="n">90</text>
  <text x="660" y="105" text-anchor="middle" class="n">365</text>
  <text x="20" y="145" class="h">Versões antigas (noncurrent)</text>
  <rect x="20" y="155" width="80" height="30" fill="#F2F3F3" stroke="#5F6B7A"/>
  <text x="60" y="175" text-anchor="middle" class="n">30 dias</text>
  <text x="115" y="175" class="n">depois de deixar de ser a versão atual, a versão é apagada de forma definitiva</text>
</svg>
