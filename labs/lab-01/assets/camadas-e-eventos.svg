<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" width="720" height="300" role="img" aria-labelledby="t d">
  <title id="t">Camadas raw e curated e o fluxo do evento até a Lambda</title>
  <desc id="d">Um CSV novo em raw/pedidos gera um evento ObjectCreated; a Lambda indexador lê o arquivo e grava o resumo em curated/resumos. O time de análise lê os resumos pelo Access Point analytics.</desc>
  <style>
    .h{font:bold 15px sans-serif;fill:#16191F}
    .t{font:13px sans-serif;fill:#16191F}
    .n{font:12px sans-serif;fill:#5F6B7A}
    .m{font:12px monospace;fill:#16191F}
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#5F6B7A"/>
    </marker>
  </defs>
  <rect x="10" y="20" width="230" height="200" rx="10" fill="#EAF2FE" stroke="#1A73E8" stroke-width="2"/>
  <text x="125" y="46" text-anchor="middle" class="h">Bucket raw</text>
  <text x="125" y="66" text-anchor="middle" class="n">imutável, versionado</text>
  <text x="25" y="100" class="m">pedidos/</text>
  <text x="40" y="120" class="m">dt=2026-03-10/</text>
  <text x="55" y="140" class="m">pedidos.csv</text>
  <text x="25" y="170" class="m">clientes/</text>
  <text x="40" y="190" class="m">cliente-0041.json</text>

  <rect x="285" y="70" width="150" height="100" rx="10" fill="#FFF8EC" stroke="#F39C12" stroke-width="2"/>
  <text x="360" y="100" text-anchor="middle" class="h">AWS Lambda</text>
  <text x="360" y="122" text-anchor="middle" class="t">indexador</text>
  <text x="360" y="148" text-anchor="middle" class="n">lê, resume, grava</text>

  <rect x="480" y="20" width="230" height="200" rx="10" fill="#EAF9F0" stroke="#2ECC71" stroke-width="2"/>
  <text x="595" y="46" text-anchor="middle" class="h">Bucket curated</text>
  <text x="595" y="66" text-anchor="middle" class="n">pronto para consulta</text>
  <text x="495" y="100" class="m">resumos/pedidos/</text>
  <text x="510" y="120" class="m">dt=2026-03-10/</text>
  <text x="525" y="140" class="m">pedidos.json</text>

  <line x1="200" y1="135" x2="283" y2="110" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
  <text x="242" y="96" text-anchor="middle" class="n">evento</text>
  <text x="242" y="82" text-anchor="middle" class="n">ObjectCreated</text>
  <line x1="435" y1="125" x2="505" y2="125" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
  <text x="470" y="115" text-anchor="middle" class="n">PutObject</text>

  <rect x="480" y="245" width="230" height="45" rx="10" fill="#FFFFFF" stroke="#232F3E" stroke-width="2"/>
  <text x="595" y="273" text-anchor="middle" class="t">Access Point analytics</text>
  <line x1="595" y1="243" x2="595" y2="222" stroke="#5F6B7A" stroke-width="2" marker-end="url(#a)"/>
  <text x="330" y="273" text-anchor="middle" class="n">time de análise: só leitura de resumos/</text>
</svg>
